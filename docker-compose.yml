name: smartcloud-finops

services:
  # ---------------------------------------------------------------------------
  # 1. Python AI & ML Engine (:8001)
  #    Forecasting, Jev Risk, 3-Sigma Anomaly Correlation, NL Parser & Briefings
  # ---------------------------------------------------------------------------
  utho-ai:
    container_name: utho-ai
    build:
      context: ${AI_APP_PATH:-../utho_ai_app}
      dockerfile: Dockerfile
    ports:
      - "${AI_PORT:-8001}:8001"
    environment:
      PORT: "8001"
      GO_BACKEND_URL: "http://utho-backend:8080"
      INVENTORY_PATH: /app/datasets/raw/inventory.csv
      PRICING_PATH: /app/datasets/raw/pricing.csv
      TELEMETRY_PATH: /app/datasets/raw/telemetry.parquet
      MODEL_DIR: /app/models/tft
      AWS_REGION: ${AWS_REGION:-in-mumbai-1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      WATTS_PER_VCPU_IDLE: ${WATTS_PER_VCPU_IDLE:-5}
      WATTS_PER_VCPU_FULL: ${WATTS_PER_VCPU_FULL:-15}
      DATA_CENTER_PUE: ${DATA_CENTER_PUE:-1.4}
      GRID_CARBON_KG_PER_KWH: ${GRID_CARBON_KG_PER_KWH:-0.71}
    volumes:
      - ${AI_APP_PATH:-../utho_ai_app}/datasets/raw:/app/datasets/raw:ro
      - model_data:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    networks:
      - smartcloud-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Go FinOps Core Engine & Unified API Gateway (:8080)
  #    85 Utho Cloud INR Resources, Peak-Safe Rightsizing & AI Proxy
  # ---------------------------------------------------------------------------
  utho-backend:
    container_name: utho-backend
    build:
      context: ${BACKEND_PATH:-.}
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PYTHON_AI_URL: "http://utho-ai:8001"
    depends_on:
      utho-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    networks:
      - smartcloud-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. React + TypeScript Glassmorphic FinOps Console (:5173 -> Nginx :80)
  #    Serves SPA and reverse-proxies /api/v1/* to utho-backend:8080
  # ---------------------------------------------------------------------------
  utho-frontend:
    container_name: utho-frontend
    build:
      context: ${FRONTEND_PATH:-../utho_frontend}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      utho-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    networks:
      - smartcloud-net
    restart: unless-stopped

networks:
  smartcloud-net:
    driver: bridge

volumes:
  model_data:
