name: Deploy FinSort Optimizer to Azure (Port 80)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          envs: GH_PAT,VM_HOST,GOOGLE_API_KEY
          script_stop: true
          script: |
            echo "Deploying FinSort Optimizer via Nginx (Port 80)..."
            mkdir -p ~/transfinitte_26
            cd ~/transfinitte_26

            # 0. Preserve existing GOOGLE_API_KEY on VM if not set in GitHub Secrets
            if [ -z "${GOOGLE_API_KEY:-}" ] && [ -f ~/transfinitte_26/.utho_env ]; then
              source ~/transfinitte_26/.utho_env
            fi
            if [ -z "${GOOGLE_API_KEY:-}" ]; then
              EXISTING_KEY=$(docker inspect utho-ai --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^GOOGLE_API_KEY=' | cut -d= -f2- || true)
              if [ -z "$EXISTING_KEY" ] && [ -f ~/transfinitte_26/utho_backend/docker-compose.yml ]; then
                EXISTING_KEY=$(grep 'GOOGLE_API_KEY:' ~/transfinitte_26/utho_backend/docker-compose.yml | awk '{print $2}' | grep -v '^\$' || true)
              fi
              if [ -n "$EXISTING_KEY" ]; then
                export GOOGLE_API_KEY="$EXISTING_KEY"
              fi
            fi
            if [ -n "${GOOGLE_API_KEY:-}" ]; then
              echo "export GOOGLE_API_KEY='$GOOGLE_API_KEY'" > ~/transfinitte_26/.utho_env
              chmod 600 ~/transfinitte_26/.utho_env
            fi

            # 1. Update utho_backend (master)
            echo "--> Updating utho_backend..."
            if [ ! -d "utho_backend" ]; then
              git clone "https://$GH_PAT@github.com/Channel-VK/utho_backend.git"
            fi
            cd ~/transfinitte_26/utho_backend
            git remote set-url origin "https://$GH_PAT@github.com/Channel-VK/utho_backend.git"
            git fetch origin
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main 2>/dev/null

            if [ -n "${GOOGLE_API_KEY:-}" ]; then
              echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" > ~/transfinitte_26/utho_backend/.env
              chmod 600 ~/transfinitte_26/utho_backend/.env
            fi

            # 2. Update utho_frontend (master)
            echo "--> Updating utho_frontend..."
            cd ~/transfinitte_26
            if [ ! -d "utho_frontend" ]; then
              git clone "https://$GH_PAT@github.com/Channel-VK/utho_frontend.git"
            fi
            cd ~/transfinitte_26/utho_frontend
            git remote set-url origin "https://$GH_PAT@github.com/Channel-VK/utho_frontend.git"
            git fetch origin
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main 2>/dev/null

            # 3. Update utho_ai_app (main)
            echo "--> Updating utho_ai_app..."
            cd ~/transfinitte_26
            if [ ! -d "utho_ai_app" ]; then
              git clone "https://$GH_PAT@github.com/risvanthkm/utho_ai_app.git"
            fi
            cd ~/transfinitte_26/utho_ai_app
            git remote set-url origin "https://$GH_PAT@github.com/risvanthkm/utho_ai_app.git"
            git fetch origin
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master 2>/dev/null

            # 4. Free Port 80 from host apache/nginx & Deploy all 4 containers
            echo "--> Freeing Port 80 and launching Docker containers..."
            sudo systemctl stop apache2 nginx 2>/dev/null || true
            sudo systemctl disable apache2 nginx 2>/dev/null || true
            sudo fuser -k 80/tcp 2>/dev/null || true

            cd ~/transfinitte_26/utho_backend

            export FRONTEND_PORT=80
            export VITE_API_BASE_URL=/api/v1
            export GOOGLE_API_KEY="${GOOGLE_API_KEY:-}"

            docker compose down --remove-orphans || true
            FRONTEND_PORT=80 docker compose up --build -d

            # 5. Wait for health checks
            echo "--> Waiting for containers to become healthy..."
            sleep 8
            docker compose ps

            # 6. Verify Nginx and API on Port 80
            echo "--> Running smoke tests on Port 80..."
            curl -s -f http://localhost/ >/dev/null && echo "Nginx React SPA (:80) Live" || echo "Frontend failed"
            curl -s -f http://localhost/api/v1/status >/dev/null && echo "Nginx -> Go Backend (/api/v1/status) Proxy Live" || echo "API Proxy failed"

            echo "Deployment Succeeded! Live at: http://$VM_HOST/"
