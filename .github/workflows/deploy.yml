name: Deploy FinSort Optimizer with HTTPS (Ports 80 & 443)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          envs: GH_PAT,VM_HOST,GOOGLE_API_KEY
          script_stop: true
          script: |
            echo "Deploying FinSort Optimizer via Nginx (HTTPS & HTTP)..."
            mkdir -p ~/transfinitte_26
            cd ~/transfinitte_26

            # 0. Preserve existing GOOGLE_API_KEY on VM if not set in GitHub Secrets
            if [ -z "${GOOGLE_API_KEY:-}" ] && [ -f ~/transfinitte_26/.utho_env ]; then
              source ~/transfinitte_26/.utho_env
            fi
            if [ -z "${GOOGLE_API_KEY:-}" ]; then
              EXISTING_KEY=$(docker inspect utho-ai --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^GOOGLE_API_KEY=' | cut -d= -f2- || true)
              if [ -z "$EXISTING_KEY" ] && [ -f ~/transfinitte_26/utho_backend/docker-compose.yml ]; then
                EXISTING_KEY=$(grep 'GOOGLE_API_KEY:' ~/transfinitte_26/utho_backend/docker-compose.yml | awk '{print $2}' | grep -v '^\$' || true)
              fi
              if [ -n "$EXISTING_KEY" ]; then
                export GOOGLE_API_KEY="$EXISTING_KEY"
              fi
            fi
            if [ -n "${GOOGLE_API_KEY:-}" ]; then
              echo "export GOOGLE_API_KEY='$GOOGLE_API_KEY'" > ~/transfinitte_26/.utho_env
              chmod 600 ~/transfinitte_26/.utho_env
            fi

            # 1. Update utho_backend (master)
            echo "--> Updating utho_backend..."
            if [ ! -d "utho_backend" ]; then
              git clone "https://$GH_PAT@github.com/Channel-VK/utho_backend.git"
            fi
            cd ~/transfinitte_26/utho_backend
            git remote set-url origin "https://$GH_PAT@github.com/Channel-VK/utho_backend.git"
            git fetch origin
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main 2>/dev/null

            if [ -n "${GOOGLE_API_KEY:-}" ]; then
              echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" > ~/transfinitte_26/utho_backend/.env
              chmod 600 ~/transfinitte_26/utho_backend/.env
            fi

            # 2. Update utho_frontend (master)
            echo "--> Updating utho_frontend..."
            cd ~/transfinitte_26
            if [ ! -d "utho_frontend" ]; then
              git clone "https://$GH_PAT@github.com/Channel-VK/utho_frontend.git"
            fi
            cd ~/transfinitte_26/utho_frontend
            git remote set-url origin "https://$GH_PAT@github.com/Channel-VK/utho_frontend.git"
            git fetch origin
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main 2>/dev/null

            # 3. Update utho_ai_app (main)
            echo "--> Updating utho_ai_app..."
            cd ~/transfinitte_26
            if [ ! -d "utho_ai_app" ]; then
              git clone "https://$GH_PAT@github.com/risvanthkm/utho_ai_app.git"
            fi
            cd ~/transfinitte_26/utho_ai_app
            git remote set-url origin "https://$GH_PAT@github.com/risvanthkm/utho_ai_app.git"
            git fetch origin
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master 2>/dev/null

            # 4. Configure SSL certificates from default Certbot directory
            echo "--> Preparing Certbot SSL certificates..."
            mkdir -p ~/transfinitte_26/utho_backend/ssl

            CERT_PATH=$(sudo find /etc/letsencrypt/live -name "fullchain.pem" 2>/dev/null | grep -E 'utho|risvanth' | head -n 1)
            KEY_PATH=$(sudo find /etc/letsencrypt/live -name "privkey.pem" 2>/dev/null | grep -E 'utho|risvanth' | head -n 1)

            if [ -z "$CERT_PATH" ]; then
              CERT_PATH=$(sudo find /etc/letsencrypt/live -name "fullchain.pem" 2>/dev/null | head -n 1)
              KEY_PATH=$(sudo find /etc/letsencrypt/live -name "privkey.pem" 2>/dev/null | head -n 1)
            fi

            if [ -n "$CERT_PATH" ] && [ -n "$KEY_PATH" ] && sudo test -f "$CERT_PATH"; then
              echo "--> Using Certbot certificate: $CERT_PATH"
              sudo cp -L "$CERT_PATH" ~/transfinitte_26/utho_backend/ssl/fullchain.pem
              sudo cp -L "$KEY_PATH" ~/transfinitte_26/utho_backend/ssl/privkey.pem
              sudo chown -R $USER:$USER ~/transfinitte_26/utho_backend/ssl
              chmod 644 ~/transfinitte_26/utho_backend/ssl/fullchain.pem
              chmod 600 ~/transfinitte_26/utho_backend/ssl/privkey.pem
            else
              echo "--> Certbot not found in /etc/letsencrypt/live, generating fallback SSL certificate..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout ~/transfinitte_26/utho_backend/ssl/privkey.pem \
                -out ~/transfinitte_26/utho_backend/ssl/fullchain.pem \
                -subj "/CN=utho.risvanth.online" 2>/dev/null || true
              chmod 644 ~/transfinitte_26/utho_backend/ssl/fullchain.pem
              chmod 600 ~/transfinitte_26/utho_backend/ssl/privkey.pem
            fi

            # 5. Free Ports 80 & 443 and launch Docker containers
            echo "--> Freeing Ports 80 and 443..."
            sudo systemctl stop apache2 nginx 2>/dev/null || true
            sudo systemctl disable apache2 nginx 2>/dev/null || true
            sudo fuser -k 80/tcp 2>/dev/null || true
            sudo fuser -k 443/tcp 2>/dev/null || true

            cd ~/transfinitte_26/utho_backend

            export FRONTEND_PORT=80
            export FRONTEND_SSL_PORT=443
            export VITE_API_BASE_URL=/api/v1
            export GOOGLE_API_KEY="${GOOGLE_API_KEY:-}"

            docker compose down --remove-orphans || true
            FRONTEND_PORT=80 FRONTEND_SSL_PORT=443 docker compose up --build -d

            # 6. Wait for health checks
            echo "--> Waiting for containers to become healthy..."
            sleep 8
            docker compose ps

            # 7. Verify Nginx on Port 80 and Port 443
            echo "--> Running smoke tests on Port 80 and Port 443..."
            curl -s -f http://localhost/healthz >/dev/null && echo "Nginx HTTP (:80) Healthz Live" || echo "HTTP Healthz failed"
            curl -s -k -f https://localhost/healthz >/dev/null && echo "Nginx HTTPS (:443) Healthz Live" || echo "HTTPS Healthz failed"
            curl -s -f http://localhost/api/v1/status >/dev/null && echo "HTTP API Proxy Live" || echo "HTTP API Proxy failed"
            curl -s -k -f https://localhost/api/v1/status >/dev/null && echo "HTTPS API Proxy Live" || echo "HTTPS API Proxy failed"

            echo "Deployment Succeeded! Live at: https://$VM_HOST/ (and http://$VM_HOST/)"
